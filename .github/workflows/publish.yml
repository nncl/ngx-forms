name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type (auto = derived from Conventional Commits)
        type: choice
        options: [auto, patch, minor, major]
        default: auto

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: write # required to create the GitHub Release and tag
  id-token: write # required for npm trusted publishing (OIDC) and provenance

env:
  LIB_DIR: projects/ngx-forms-handle-errors
  DIST_DIR: dist/ngx-forms-handle-errors

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags and history are needed to compute the next version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (trusted publishing requires >= 11.5.1)
        run: npm install -g npm@latest

      - name: Compute next version
        id: version
        run: |
          FALLBACK=$(node -p "require('./$LIB_DIR/package.json').version")
          read -r LAST NEXT BUMP <<<"$(.github/scripts/next-version.sh "${{ inputs.release_type || 'auto' }}" "$FALLBACK")"
          echo "last=$LAST" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          if [ "$BUMP" = "none" ]; then
            echo "### No release: no \`feat\`, \`fix\`, \`perf\` or breaking change since \`$LAST\`" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install dependencies
        if: steps.version.outputs.bump != 'none'
        run: npm ci

      - name: Set version
        if: steps.version.outputs.bump != 'none'
        working-directory: ${{ env.LIB_DIR }}
        run: npm pkg set version="${{ steps.version.outputs.next }}"

      - name: Test and build library
        if: steps.version.outputs.bump != 'none'
        run: npm run build:publish

      - name: Publish
        if: steps.version.outputs.bump != 'none'
        working-directory: ${{ env.DIST_DIR }}
        env:
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already published, skipping."
          else
            npm publish --provenance --access public
          fi

      - name: Create GitHub Release
        if: steps.version.outputs.bump != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists, skipping."
          else
            gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
          fi
          echo "### Released \`$VERSION\` (${{ steps.version.outputs.bump }} from \`${{ steps.version.outputs.last }}\`)" >> "$GITHUB_STEP_SUMMARY"
