name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # required for npm trusted publishing (OIDC) and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm (trusted publishing requires >= 11.5.1)
        run: npm install -g npm@latest

      - name: Check if version is already published
        id: check
        run: |
          NAME=$(node -p "require('./projects/ngx-forms-handle-errors/package.json').name")
          VERSION=$(node -p "require('./projects/ngx-forms-handle-errors/package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already published, skipping."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.check.outputs.publish == 'true'
        run: npm ci

      - name: Test and build library
        if: steps.check.outputs.publish == 'true'
        run: npm run build:publish

      - name: Publish
        if: steps.check.outputs.publish == 'true'
        working-directory: dist/ngx-forms-handle-errors
        run: npm publish --provenance --access public
